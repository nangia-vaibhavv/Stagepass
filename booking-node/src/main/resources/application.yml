server:
  port: ${PORT:${SERVER_PORT:8091}}
spring:
  application:
    name: booking-node
  datasource:
    url: ${DATABASE_JDBC_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/stagepass}}
    username: ${DATABASE_USER:${PGUSER:stagepass}}
    password: ${DATABASE_PASSWORD:${PGPASSWORD:local-development-only}}
  flyway:
    enabled: false
  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:${SPRING_DATA_REDIS_REDIS_URL:${REDIS_URL:redis://localhost:6379}}}
  jackson:
    default-property-inclusion: non_null
stagepass:
  scheduling:
    enabled: ${STAGEPASS_SCHEDULING_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:stagepass}
  payment:
    base-url: ${PAYMENT_BASE_URL:http://localhost:8090}
    service-token: ${PAYMENT_SERVICE_TOKEN:local-payment-service-token}
  callback-url: ${BOOKING_CALLBACK_URL:http://localhost:8091/internal/payment-callback}
  catalog:
    base-url: ${CATALOG_BASE_URL:http://localhost:8082}
  hold-ttl: 5m
